<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#107c41">
<title>MaliAI · احكي للكمبيوتر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="pair.js?v=20261108"></script>
<style>
:root{ --bg:#ffffff; --bg2:#f3f6f4; --fg:#18201b; --fg2:#5b6660; --line:#dde3df; --accent:#107c41; --accent2:#0d6435; --tint:#e6f3eb; --err:#c0392b; --rec:#d23a2a; }
@media (prefers-color-scheme: dark){ :root{ --bg:#161b18; --bg2:#202722; --fg:#e8eee9; --fg2:#a0aca5; --line:#343d37; --accent:#2ea866; --accent2:#3cc078; --tint:#1c3326; --err:#ff7b6b; --rec:#ff6a5a; } }
*{ box-sizing:border-box; }
html, body{ height:100%; }
body{ margin:0; padding:16px 16px calc(16px + env(safe-area-inset-bottom)); background:var(--bg); color:var(--fg);
  font:16px/1.6 "IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif; display:flex; flex-direction:column; gap:12px; }
header{ display:flex; align-items:baseline; gap:8px; }
header b{ font-size:19px; color:var(--accent); }
header span{ color:var(--fg2); font-size:14px; }
#state{ margin:0; padding:8px 12px; border-radius:10px; background:var(--bg2); color:var(--fg2); font-size:14px; white-space:pre-line; }
#state.on{ background:var(--tint); color:var(--accent); font-weight:600; }
#state.bad{ color:var(--err); }
textarea{ flex:1; min-height:160px; width:100%; padding:14px; border:1px solid var(--line); border-radius:14px; background:var(--bg); color:var(--fg); font:inherit; font-size:17px; resize:none; }
textarea:focus{ outline:none; border-color:var(--accent); }
.hint{ margin:0; color:var(--fg2); font-size:13px; text-align:center; }
.bar{ display:flex; align-items:center; gap:12px; }
button{ font:inherit; border:0; border-radius:14px; cursor:pointer; color:inherit; }
button:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }
button:disabled{ opacity:.45; }
#mic{ flex:none; width:72px; height:72px; border-radius:50%; background:var(--accent); color:#fff; display:grid; place-items:center; }
#mic[aria-pressed="true"]{ background:var(--rec); animation:pulse 1.2s ease-in-out infinite; }
#mic svg{ width:30px; height:30px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
#send{ flex:1; height:56px; background:var(--accent); color:#fff; font-weight:700; font-size:17px; }
#clear{ flex:none; height:56px; padding:0 14px; background:var(--bg2); color:var(--fg2); }
.cams{ display:flex; gap:8px; }
#cam{ flex:2; height:60px; background:var(--accent); color:#fff; font-weight:700; font-size:17px; }
#gal{ flex:1; height:60px; background:var(--tint); color:var(--accent); font-weight:600; border:1.5px dashed var(--accent); }
#photos{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; max-height:32vh; overflow:auto; }
#photos li{ display:flex; align-items:center; gap:10px; padding:6px 8px; border-radius:10px; background:var(--bg2); font-size:14px; }
#photos img{ flex:none; width:44px; height:44px; border-radius:8px; object-fit:cover; }
#photos .st{ color:var(--fg2); }
#photos li.ok .st{ color:var(--accent); font-weight:600; }
#photos li.bad .st{ color:var(--err); }
@keyframes pulse{ 50%{ box-shadow:0 0 0 10px color-mix(in srgb, var(--rec) 25%, transparent); } }
@media (prefers-reduced-motion: reduce){ *{ animation:none !important; } }
</style>
</head>
<body>
<header><b>MaliAI</b><span>احكي أو صوّر فاتورة، وبتوصل لكمبيوترك</span></header>
<p id="state" role="status" aria-live="polite">بربط مع الكمبيوتر…</p>
<div class="cams">
  <button id="cam" type="button">📷 صوّر فاتورة</button>
  <button id="gal" type="button">🖼️ من الصور</button>
</div>
<!-- capture: بيفتح الكاميرا فوراً (أندرويد ما بيعرض الكاميرا مع «اختار أكثر من صورة») -->
<input id="shoot" type="file" accept="image/*" capture="environment" hidden>
<input id="pick" type="file" accept="image/*" multiple hidden>
<ul id="photos" aria-live="polite"></ul>
<textarea id="text" placeholder="اكبس المايك واحكي، أو اكبس 🎤 بلوحة المفاتيح"></textarea>
<p class="hint" id="hint">بعد ما تخلّص، اكبس «ابعت للكمبيوتر» والكلام بيطلع بمربّع الطلب هناك.</p>
<div class="bar">
  <button id="mic" type="button" aria-label="احكي" aria-pressed="false">
    <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
  </button>
  <button id="send" type="button">ابعت للكمبيوتر</button>
  <button id="clear" type="button" aria-label="امسح النصّ">امسح</button>
</div>
<script>
const $ = id => document.getElementById(id);
const CHUNK = 1000;   // ponytail: الوسيط بياخد لحدّ 4 كيلوبايت بالرسالة، فالكلام الطويل بينبعت على دفعات
const say = (t, cls = "") => { $("state").textContent = t; $("state").className = cls; };

// الربط: السرّ وعنوان الوسيط بعد # بالرابط اللي بالـQR، وبينحفظوا على التلفون للمرّات الجاية
const h = new URLSearchParams(location.hash.slice(1));
let secret = h.get("k"), relay = h.get("r");
try {
  if (secret) localStorage.setItem("maliai.phone", JSON.stringify({ secret, relay }));
  else ({ secret, relay } = JSON.parse(localStorage.getItem("maliai.phone")) || {});
} catch (e) {}
let link = null;
// كل رسالة إلها رقم، والكمبيوتر بيردّ «وصلني» بنفس الرقم: ✓ بس لمّا الكلام يوصل فعلاً
const acks = {};
const ACK_WAIT = 9000;   // الكمبيوتر بيسأل الوسيط كل ٣ ثواني، والتلفون كل ثانية ونص
async function post(obj) {
  const n = crypto.getRandomValues(new Uint32Array(2)).join("-");
  const got = new Promise(ok => { acks[n] = ok; setTimeout(() => { delete acks[n]; ok(false); }, ACK_WAIT); });
  await MaliPair.post(link.topic, await MaliPair.seal(link.key, { ...obj, n }), relay);
  return got;
}
const NO_PC = "انبعت، بس الكمبيوتر ما ردّ. تأكّد إنّ إكسل فاتح وإنّ MaliAI مربوط بهالتلفون (إذا انعمل «ربط جديد» صوّر الرمز الجديد).";
(async () => {
  if (!secret) { say("الصفحة مش مربوطة. افتح MaliAI بالكمبيوتر، اكبس 📱 وصوّر الرمز.", "bad"); $("send").disabled = $("mic").disabled = $("cam").disabled = $("gal").disabled = true; return; }
  try {
    link = await MaliPair.derive(secret);
    MaliPair.listen(link.topic, async m => {
      try {
        const p = await MaliPair.open(link.key, m.message);
        if (p.ack && acks[p.ack]) { acks[p.ack](p); delete acks[p.ack]; }   // الردّ نفسه: للصور لازم يقول photo
        if (p.info) say("💻 " + p.info, "on");   // نتيجة التفريغ من الكمبيوتر
      } catch (x) {}
    }, relay, 1500);
    await new Promise(ok => setTimeout(ok, 1600));   // أوّل سؤال للوسيط قبل ما نسلّم على الكمبيوتر
    const ok = await post({ hello: true });
    say(ok ? "✓ مربوط مع كمبيوترك" : NO_PC, ok ? "on" : "bad");
  } catch (e) { say("ما قدرت أوصل للوسيط. تأكّد من النت وارجع افتح الصفحة.", "bad"); }
})();

$("send").onclick = async () => {
  stopMic();
  const text = $("text").value.trim();
  if (!text || !link) return;
  $("send").disabled = true;
  say("ببعت…");
  try {
    let ok = true;
    for (let i = 0; i < text.length; i += CHUNK) ok = (await post({ text: text.slice(i, i + CHUNK) })) && ok;
    if (ok) { $("text").value = ""; say("✓ وصل للكمبيوتر. راجعه هناك وابعت.", "on"); }
    else say(NO_PC, "bad");
  } catch (e) { say("ما وصل: " + (e.message || e) + ". جرّب كمان مرّة.", "bad"); }
  finally { $("send").disabled = false; }
};
$("clear").onclick = () => { $("text").value = ""; $("text").focus(); };

// صور الفواتير: بتتشفّر هون وبتنزل على تبويب الفواتير بالكمبيوتر وبتتفرّغ لحالها.
// بتنبعت بدقّة عالية (لحدّ ١٢ ميغابكسل): الكمبيوتر بيعمل منها الصفحة كاملة + أجزاء مكبّرة عشان الأرقام الصغيرة تنقرا صح
const MAX_PHOTOS = 20, PHOTO_WAIT = 40000;
async function shrinkPhoto(file) {
  const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
  const s = Math.min(1, 4096 / Math.max(bmp.width, bmp.height), Math.sqrt(12.5e6 / (bmp.width * bmp.height)));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
  const g = c.getContext("2d");
  g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.imageSmoothingQuality = "high";
  g.drawImage(bmp, 0, 0, c.width, c.height);
  const blob = await new Promise(ok => c.toBlob(ok, "image/jpeg", 0.88));
  return { bytes: new Uint8Array(await blob.arrayBuffer()), type: "image/jpeg" };
}
const OLD_PC = "الكمبيوتر ردّ بس عليه نسخة قديمة من الإضافة، فالصورة ما انفرّغت. سكّر إكسل كلّه وافتحه من جديد، وابعتها كمان مرّة.";
async function sendPhoto(file, i, of, li) {
  const st = li.querySelector(".st");
  st.textContent = "بجهّز الصورة…";
  // صيغة ما بيقدر المتصفّح يفتحها (HEIC مثلاً) بتنبعت زي ما هي، والكمبيوتر بيحوّلها
  const img = await shrinkPhoto(file).catch(() => null) || { bytes: new Uint8Array(await file.arrayBuffer()), type: file.type || "image/heic" };
  st.textContent = `ببعت (${Math.round(img.bytes.length / 1024)} ك.ب)…`;
  const n = crypto.getRandomValues(new Uint32Array(2)).join("-");
  const got = new Promise(ok => { acks[n] = ok; setTimeout(() => { delete acks[n]; ok(false); }, PHOTO_WAIT); });
  const name = file.name && !/^image\.\w+$/i.test(file.name) ? file.name.replace(/\.\w+$/, "") + (img.type === "image/jpeg" ? ".jpg" : "") : `فاتورة من التلفون ${new Date().toLocaleTimeString("en-GB").replace(/:/g, "-")} (${i}).jpg`;
  const meta = await MaliPair.seal(link.key, { photo: true, n, name, type: img.type, i, of });
  await MaliPair.upload(link.topic, await MaliPair.sealBytes(link.key, img.bytes), meta, relay);
  st.textContent = "انبعتت، بستنّى الكمبيوتر…";
  return { got };   // منرجّع الوعد بدون ما نستنّاه، عشان الصورة الجاية تنبعت فوراً
}
$("cam").onclick = () => $("shoot").click();
$("gal").onclick = () => $("pick").click();
$("shoot").onchange = $("pick").onchange = e => {
  const files = [...e.target.files].slice(0, MAX_PHOTOS);
  e.target.value = "";
  return sendBatch(files);
};
let sending = Promise.resolve();
// كل دفعة بتستنّى اللي قبلها (لو صوّرت ورا بعض بسرعة)
const sendBatch = files => (sending = sending.then(() => sendNow(files)).catch(() => {}));
async function sendNow(files) {
  if (!files.length || !link) return;
  for (let i = 0; i < files.length; i++) {
    const li = document.createElement("li"), im = document.createElement("img"), st = document.createElement("span");
    im.src = URL.createObjectURL(files[i]); im.alt = ""; st.className = "st"; st.textContent = "بالدور…";
    li.append(im, st); $("photos").prepend(li);
    files[i].li = li;
  }
  // الرفع ورا بعض بدون ما نستنّى ردّ كل وحدة، فالكمبيوتر بيستلمهم سوا وبيفرّغهم دفعة وحدة
  const waits = [];
  for (let i = 0; i < files.length; i++) {
    const li = files[i].li, st = li.querySelector(".st");
    say(`ببعت صورة ${i + 1} من ${files.length}…`);
    try {
      const { got } = await sendPhoto(files[i], i + 1, files.length, li);
      // ✓ بس لمّا الكمبيوتر يقول إنّه استلم الصورة نفسها وحطّها للتفريغ؛ ردّ بدون photo = إضافة قديمة ما بتعرف الصور
      waits.push(got.then(r => {
        const res = r && r.photo ? "ok" : r && r.error ? "err" : r ? "old" : "none";
        li.className = res === "ok" ? "ok" : "bad";
        st.textContent = res === "ok" ? "✓ الكمبيوتر استلمها، عم تتفرّغ" : res === "err" ? "✗ " + r.error : res === "old" ? "✗ الكمبيوتر عليه نسخة قديمة" : "✗ انبعتت بس الكمبيوتر ما ردّ";
        return res;
      }));
    } catch (x) { li.className = "bad"; st.textContent = "✗ ما انبعتت: " + (x.message || x); }
  }
  if (waits.length) say("انبعتت، بستنّى الكمبيوتر يستلم…");
  const res = await Promise.all(waits), ok = res.filter(r => r === "ok").length, n = files.length;
  const count = k => k === 1 ? "الصورة" : k === 2 ? "الصورتين" : k + " صور";
  say(ok === n ? `✓ الكمبيوتر استلم ${count(ok)}. النتيجة بتطلع هون وبشيت «الفواتير».`
    : res.includes("old") ? OLD_PC : ok ? `وصل ${ok} من ${n}. الباقي جرّبه كمان مرّة.` : NO_PC, ok === n ? "on" : "bad");
}

// مايك التلفون: تفريغ المتصفّح نفسه (مجّاني)، والكلام بينكتب وإنت بتحكي
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
if (!SR) { $("mic").hidden = true; $("hint").textContent = "اكبس 🎤 بلوحة المفاتيح واحكي، وبعدين «ابعت للكمبيوتر»."; }
const stopMic = () => { if (rec) { rec.stopped = true; rec.sr.stop(); } };
$("mic").onclick = () => {
  if (rec) { stopMic(); return; }
  const sr = new SR(), base = $("text").value.trim();
  const me = rec = { sr, stopped: false, done: "", cur: "", quick: 0, started: Date.now(), heard: false };
  const show = () => { $("text").value = [base, MaliSpeech.join(me.done, me.cur)].filter(Boolean).join(" "); };
  sr.lang = "ar-JO"; sr.continuous = true; sr.interimResults = true;
  // النصّ بينبني من جديد مع كل نتيجة (أندرويد بيرجّع الجملة كلّها كل مرّة)، فما بيتكرّر
  sr.onresult = e => { me.cur = MaliSpeech.session(e.results); me.heard = true; show(); };
  sr.onerror = e => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      me.stopped = true;
      say("التلفون مانع المايك عن الصفحة. اسمحله من إعدادات المتصفّح، أو استعمل 🎤 بلوحة المفاتيح.", "bad");
    }
  };
  sr.onend = () => {
    me.done = MaliSpeech.join(me.done, me.cur); me.cur = ""; show();
    // التلفون بيوقف بعد كل سكتة: منرجّع نسمع لحدّ ما تكبس المايك (إلّا إذا بيسكّر فوراً كل مرّة)
    me.quick = Date.now() - me.started < 1500 && !me.heard ? me.quick + 1 : 0;
    if (!me.stopped && me.quick < 3) { me.heard = false; me.started = Date.now(); try { sr.start(); return; } catch (x) {} }
    if (rec === me) rec = null;
    $("mic").setAttribute("aria-pressed", "false");
  };
  sr.start();
  $("mic").setAttribute("aria-pressed", "true");
};
</script>
</body>
</html>
