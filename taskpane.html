<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MaliAI — تفريغ الفواتير</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --bg:#ffffff; --bg2:#f4f6f8; --fg:#1b1d21; --fg2:#5b6270;
  --line:#dfe3e8; --accent:#107c41; --accent2:#0d6435; --err:#c0392b;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#1b1d21; --bg2:#25282c; --fg:#eceef1; --fg2:#a2a9b5; --line:#363a40; --accent:#2ea866; --accent2:#3cc078; --err:#ff7b6b; }
}
*{ box-sizing:border-box; }
body{ margin:0; padding:12px; background:var(--bg); color:var(--fg); font:14px/1.5 "Segoe UI",Tahoma,sans-serif; }
header{ font-size:16px; margin-bottom:10px; }
header b{ color:var(--accent); }
.drop{ display:block; padding:18px 12px; border:2px dashed var(--line); border-radius:10px; background:var(--bg2); text-align:center; cursor:pointer; }
.drop.over, .drop:focus-within{ border-color:var(--accent); }
.drop small{ display:block; color:var(--fg2); }
ul{ list-style:none; padding:0; margin:10px 0; }
li{ padding:6px 8px; border-bottom:1px solid var(--line); font-size:13px; }
li .st{ display:block; color:var(--fg2); }
li.err .st{ color:var(--err); }
button{ font:inherit; border-radius:8px; cursor:pointer; }
#go{ width:100%; padding:10px; border:0; background:var(--accent); color:#fff; font-weight:600; }
#go:hover{ background:var(--accent2); }
#go:disabled{ opacity:.5; cursor:default; }
#clear, #save{ padding:4px 10px; border:1px solid var(--line); background:var(--bg2); color:var(--fg); }
button:focus-visible, input:focus-visible, select:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
#status{ min-height:1.5em; color:var(--fg2); }
details{ margin-top:14px; border-top:1px solid var(--line); padding-top:8px; }
summary{ cursor:pointer; color:var(--fg2); }
details label{ display:block; margin:8px 0 2px; font-size:13px; }
details input, details select{ width:100%; padding:6px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); font:inherit; }
details small{ display:block; color:var(--fg2); margin:6px 0; }
.tabs{ display:flex; gap:6px; margin-bottom:12px; }
.tabs button{ flex:1; padding:7px; border:1px solid var(--line); background:var(--bg2); color:var(--fg); }
.tabs button[aria-selected="true"]{ background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
#chat{ display:flex; flex-direction:column; gap:8px; margin-bottom:10px; }
.msg{ padding:8px 10px; border-radius:10px; white-space:pre-wrap; overflow-wrap:anywhere; }
.msg.me{ background:var(--bg2); border:1px solid var(--line); align-self:flex-start; max-width:90%; }
.msg.ai{ border:1px solid var(--accent); }
.msg.step{ padding:0 4px; color:var(--fg2); font-size:12px; }
.msg.err{ color:var(--err); }
#ask{ width:100%; padding:8px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); font:inherit; resize:vertical; }
.row{ display:flex; gap:6px; margin-top:6px; }
#send{ flex:1; padding:8px; border:0; background:var(--accent); color:#fff; font-weight:600; }
#send:disabled{ opacity:.5; cursor:default; }
#stop, #newchat{ padding:8px 10px; border:1px solid var(--line); background:var(--bg2); color:var(--fg); }
</style>
</head>
<body>
<header><b>MaliAI</b> · محاسبك جوّا إكسل</header>
<div class="tabs" role="tablist">
  <button id="t-inv" role="tab" aria-selected="true" aria-controls="tab-inv">تفريغ الفواتير</button>
  <button id="t-chat" role="tab" aria-selected="false" aria-controls="tab-chat">مساعد إكسل</button>
</div>

<section id="tab-chat" role="tabpanel" hidden>
  <div id="chat"></div>
  <textarea id="ask" rows="3" placeholder="مثلاً: اعمل شيت ملخّص للفواتير حسب الحساب والشهر، مع المجاميع ورسم بياني"></textarea>
  <div class="row">
    <button id="send" type="button">ابعت</button>
    <button id="stop" type="button" hidden>وقّف</button>
    <button id="newchat" type="button">محادثة جديدة</button>
  </div>
  <p id="cstatus" role="status" aria-live="polite"></p>
</section>

<section id="tab-inv" role="tabpanel">
<label id="drop" class="drop">
  <input id="files" type="file" multiple hidden>
  <b>اسحب الفواتير هون أو اكبس للاختيار</b>
  <small>صور · PDF · Word · Excel · XML الفوترة · أو الصق صورة بـ Ctrl+V</small>
</label>
<ul id="list"></ul>
<button id="go" disabled>فرّغ لإكسل</button>
<p id="status" role="status" aria-live="polite"></p>
<button id="clear" type="button" hidden>فضّي القائمة</button>
</section>

<details id="settings">
  <summary>الإعدادات — مفتاح الذكاء الاصطناعي</summary>
  <label for="prov">المزوّد</label><select id="prov"></select>
  <label for="model">النموذج</label><input id="model" dir="ltr">
  <label for="url">الرابط</label><input id="url" dir="ltr">
  <label for="key">المفتاح</label><input id="key" type="password" dir="ltr" autocomplete="off">
  <small>المفتاح بينحفظ على جهازك بس، مش بكود الصفحة.</small>
  <button id="save" type="button">احفظ</button>
</details>

<script>
const PROVIDERS = {
  gemini:     { label: "Google Gemini (سريع، مفتاح مجاني من aistudio.google.com)", url: "https://generativelanguage.googleapis.com/v1beta/openai", model: "gemini-flash-latest" },
  anthropic:  { label: "Anthropic Claude (مفتاح من console.anthropic.com)", url: "https://api.anthropic.com", model: "claude-opus-5-5" },
  openrouter: { label: "OpenRouter", url: "https://openrouter.ai/api/v1", model: "google/gemini-2.5-flash" },
  custom:     { label: "مخصّص (صيغة OpenAI)", url: "", model: "" }
};
const CFG_KEY = "maliai.invoices.cfg";
const MAX_SIDE = 1600;    // أكبر ضلع للصورة المرسلة: أصغر = أسرع رفع
const MAX_PAGES = 3;      // ponytail: أوّل 3 صفحات من كل PDF/TIFF، زيدها إذا في فواتير أطول
const MAX_TEXT = 60000;   // ponytail: أوّل 60 ألف حرف من الملفات النصّيّة (Excel/Word/XML)
const PARALLEL = 4;       // فواتير بنفس الوقت، نزّلها إذا المزوّد بيرجّع 429

// قرّاء الصيغ الثانية بينحمّلوا بس لمّا ييجي ملف بيحتاجهم
const LIBS = {
  xlsx:    "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js",
  mammoth: "https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js",
  heic:    "https://cdnjs.cloudflare.com/ajax/libs/heic2any/0.0.4/heic2any.min.js",
  utif:    "https://cdn.jsdelivr.net/npm/utif@3.1.0/UTIF.js"
};
const ANTHROPIC_SDK = "https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.131.0/+esm";

// الأعمدة الجديدة بتنضاف بالآخر عشان الصفوف القديمة بالشيت تضلّ تحت عناوينها
const INV_HEAD  = ["الملف", "المورّد", "الرقم الضريبي", "رقم الفاتورة", "التاريخ", "العملة", "قبل الضريبة", "الضريبة", "الإجمالي", "ملاحظات المحاسب", "الحساب", "نسبة الضريبة %"];
const ITEM_HEAD = ["الملف", "رقم الفاتورة", "البند", "الكمية", "سعر الوحدة", "القيمة", "تدقيق"];

// ponytail: دليل حسابات عامّ، بدّله بدليل حسابات الشركة لمّا يوصلنا
const ACCOUNTS = ["مشتريات بضاعة", "مستلزمات مكتبية", "صيانة وإصلاح", "محروقات ومواصلات", "كهرباء ومياه", "اتصالات وإنترنت",
  "إيجارات", "ضيافة ونظافة", "رسوم حكومية", "أتعاب مهنية", "دعاية وإعلان", "أصول ثابتة", "أخرى"];

const SYSTEM = `You are a senior chartered accountant in Jordan with audit experience.
You read every invoice the way an accountant books it: carefully, never guessing, and you flag anything an auditor would question.
You know the Jordanian General Sales Tax: the standard rate is 16%; some goods and services are 0%, exempt, or at special rates; a valid tax invoice shows the seller's tax number.`;

const PROMPT = `Book this one invoice (Arabic or English), given as page images and/or extracted text (CSV, HTML, or XML such as a UBL e-invoice).
Return ONLY one JSON object, no prose, exactly this shape:
{"vendor":"","vendor_tax_no":"","invoice_no":"","date":"YYYY-MM-DD","currency":"",
 "items":[{"description":"","qty":0,"unit_price":0,"total":0}],
 "subtotal":0,"tax":0,"total":0,"account":"","notes":""}
Rules: numbers as plain JSON numbers with Western digits (convert ٠-٩), no thousands separators.
Use null for anything not on the invoice. Never guess. Keep descriptions in the invoice's language.
currency as ISO code (JOD, USD, ...). One entry in items per line on the invoice.
account: the single best booking account for this invoice, exactly one of: ${ACCOUNTS.join(" | ")}.
notes: short Arabic remarks, only for what an accountant must check before booking (missing seller tax number, unusual tax rate,
illegible or handwritten amounts, not a tax invoice, totals that don't add up, date in the future); "" if nothing.`;

const $ = id => document.getElementById(id);
const queue = [];   // [{file, li}]
let inExcel = false;

// ---------- الإعدادات (على الجهاز فقط) ----------
const readCfg = () => { try { return JSON.parse(localStorage.getItem(CFG_KEY)) || {}; } catch (e) { return {}; } };
function fillCfg() {
  const c = readCfg(), p = c.provider || "gemini";
  $("prov").innerHTML = Object.entries(PROVIDERS).map(([k, v]) => `<option value="${k}">${v.label}</option>`).join("");
  $("prov").value = p;
  $("url").value = c.url || PROVIDERS[p].url;
  $("model").value = c.model || PROVIDERS[p].model;
  $("key").value = c.key || "";
  if (!c.key) $("settings").open = true;
}
$("prov").onchange = () => {
  const p = PROVIDERS[$("prov").value];
  if (p.url) { $("url").value = p.url; $("model").value = p.model; }
};
$("save").onclick = () => {
  const c = { provider: $("prov").value, url: $("url").value.trim(), model: $("model").value.trim(), key: $("key").value.trim() };
  try { localStorage.setItem(CFG_KEY, JSON.stringify(c)); setStatus("انحفظت الإعدادات."); } catch (e) { setStatus("ما قدرت أحفظ الإعدادات بهالجهاز."); }
  if (c.key) $("settings").open = false;
};

// ---------- إضافة الملفات ----------
function addFiles(files) {
  for (const file of files) {
    const li = document.createElement("li");
    li.innerHTML = `<span></span><span class="st">جاهزة</span>`;
    li.firstChild.textContent = file.name || "صورة ملصوقة";
    $("list").append(li);
    queue.push({ file, li });
  }
  $("go").disabled = !queue.length;
  $("clear").hidden = !queue.length;
}
$("files").onchange = e => { addFiles(e.target.files); e.target.value = ""; };
const drop = $("drop");
drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); addFiles(e.dataTransfer.files); };
document.onpaste = e => { if (!$("tab-inv").hidden) addFiles(e.clipboardData.files); };
$("clear").onclick = () => { queue.length = 0; $("list").innerHTML = ""; addFiles([]); setStatus(""); };

// ---------- أيّ ملف ← صور JPEG صغيرة أو نصّ ----------
const loaded = {};
const lib = name => loaded[name] || (loaded[name] = new Promise((ok, bad) => {
  const s = document.createElement("script");
  s.src = LIBS[name]; s.onload = ok;
  s.onerror = () => { delete loaded[name]; bad(new Error("ما قدرت أحمّل قارئ هالصيغة — تأكّد من النت")); };
  document.head.append(s);
}));
function canvasFor(w, h) {
  const c = document.createElement("canvas");
  c.width = Math.round(w); c.height = Math.round(h);
  const g = c.getContext("2d");
  g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);   // الشفاف بيطلع أسود بـ JPEG
  return [c, g];
}
function shrink(src, w, h) {   // src: صورة أو canvas بحجمها الأصلي
  const s = Math.min(1, MAX_SIDE / Math.max(w, h));
  const [c, g] = canvasFor(w * s, h * s);
  g.drawImage(src, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", 0.85);
}
async function toParts(file) {
  const ext = (file.name || "").toLowerCase().split(".").pop();
  if (file.type === "application/pdf" || ext === "pdf") {
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
    const images = [];
    for (let n = 1; n <= Math.min(pdf.numPages, MAX_PAGES); n++) {
      const page = await pdf.getPage(n);
      const v1 = page.getViewport({ scale: 1 });
      const vp = page.getViewport({ scale: MAX_SIDE / Math.max(v1.width, v1.height) });
      const [c, g] = canvasFor(vp.width, vp.height);
      // intent "print": الرسم ما بيستنّى requestAnimationFrame، اللي بيوقف إذا اللوحة مخفيّة
      await page.render({ canvasContext: g, viewport: vp, intent: "print" }).promise;
      images.push(c.toDataURL("image/jpeg", 0.85));
    }
    return { images };
  }
  if (/^(heic|heif)$/.test(ext) || /hei[cf]/.test(file.type)) {   // صور الآيفون
    await lib("heic");
    const jpg = await heic2any({ blob: file, toType: "image/jpeg", quality: 0.9 });
    const bmp = await createImageBitmap(Array.isArray(jpg) ? jpg[0] : jpg);
    return { images: [shrink(bmp, bmp.width, bmp.height)] };
  }
  if (/^tiff?$/.test(ext) || file.type === "image/tiff") {           // السكانرات
    await lib("utif");
    const buf = await file.arrayBuffer();
    const pages = UTIF.decode(buf).filter(p => p.t256).slice(0, MAX_PAGES);   // t256 = العرض؛ width بينعبّى بعد decodeImage
    return { images: pages.map(p => {
      UTIF.decodeImage(buf, p);
      const c = document.createElement("canvas"); c.width = p.width; c.height = p.height;
      c.getContext("2d").putImageData(new ImageData(new Uint8ClampedArray(UTIF.toRGBA8(p)), p.width, p.height), 0, 0);
      return shrink(c, p.width, p.height);
    }) };
  }
  if (/^(xlsx|xlsm|xlsb|xls|ods)$/.test(ext)) {
    await lib("xlsx");
    const wb = XLSX.read(await file.arrayBuffer());
    return { text: wb.SheetNames.map(n => "# " + n + "\n" + XLSX.utils.sheet_to_csv(wb.Sheets[n])).join("\n\n") };
  }
  if (ext === "docx") {
    await lib("mammoth");
    const r = await mammoth.convertToHtml({ arrayBuffer: await file.arrayBuffer() },
      { convertImage: mammoth.images.imgElement(() => Promise.resolve({ src: "" })) });
    return { text: r.value };
  }
  try {
    const bmp = await createImageBitmap(file);
    return { images: [shrink(bmp, bmp.width, bmp.height)] };
  } catch (e) {}
  const text = await file.text();   // XML / CSV / TXT / HTML / EML…
  if (!text.trim() || text.slice(0, 2000).includes("\u0000"))
    throw new Error(`صيغة .${ext} مش مدعومة — حوّلها PDF أو صورة`);
  return { text };
}

// ---------- نداء واحد للنموذج لكل فاتورة ----------
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function extract({ images = [], text = "" }, c) {
  if (!images.length && !text.trim()) throw new Error("ما لقيت إشي أقرأه بالملف");
  const prompt = text ? PROMPT + "\n\nInvoice content:\n" + text.slice(0, MAX_TEXT) : PROMPT;
  const content = c.provider === "anthropic" ? await askClaude(images, prompt, c) : await askOpenAI(images, prompt, c);
  const m = String(content).match(/\{[\s\S]*\}/);
  if (!m) throw new Error("النموذج ما رجّع بيانات مفهومة");
  return JSON.parse(m[0]);
}

async function askClaude(images, prompt, c) {
  const { default: Anthropic } = await import(ANTHROPIC_SDK);
  // المفتاح من إعدادات هالجهاز، مش من كود الصفحة
  const client = new Anthropic({ apiKey: c.key, baseURL: c.url || undefined, dangerouslyAllowBrowser: true });
  // fallbacks بيشتغل على هالنماذج بس (Haiku ما بيدعمه)
  const fb = /^claude-(opus-5|fable-5|sonnet-5-5)/.test(c.model) ? { betas: ["server-side-fallback-2026-07-01"], fallbacks: "default" } : {};
  try {
    const msg = await client.beta.messages.create({
      model: c.model, max_tokens: 16000,
      output_config: { effort: "low" },   // استخراج بسيط: low أسرع
      ...fb,
      system: SYSTEM,
      messages: [{ role: "user", content: [
        ...images.map(url => ({ type: "image", source: { type: "base64", media_type: "image/jpeg", data: url.slice(url.indexOf(",") + 1) } })),
        { type: "text", text: prompt }
      ] }]
    });
    if (msg.stop_reason === "refusal") throw new Error("Claude رفض يقرأ هالملف");
    return msg.content.filter(b => b.type === "text").map(b => b.text).join("");
  } catch (e) {
    if (e instanceof Anthropic.AuthenticationError || e instanceof Anthropic.PermissionDeniedError) throw new Error("المفتاح مرفوض — صلّحه من الإعدادات");
    if (e instanceof Anthropic.NotFoundError) throw new Error("اسم النموذج غلط — صلّحه من الإعدادات");
    if (e instanceof Anthropic.RateLimitError) throw new Error("وصلت حدّ Anthropic، استنّى دقيقة وجرّب");
    if (e instanceof Anthropic.APIError) throw new Error("Anthropic: " + e.message);
    throw e;
  }
}

async function askOpenAI(images, prompt, c) {
  const body = JSON.stringify({
    model: c.model, temperature: 0,
    messages: [{ role: "system", content: SYSTEM },
               { role: "user", content: [{ type: "text", text: prompt }, ...images.map(url => ({ type: "image_url", image_url: { url } }))] }]
  });
  for (let attempt = 1; ; attempt++) {
    const r = await fetch(c.url.replace(/\/+$/, "") + "/chat/completions", {
      method: "POST", headers: { "Content-Type": "application/json", "Authorization": "Bearer " + c.key }, body
    });
    const raw = await r.text();
    if ((r.status === 429 || r.status >= 500) && attempt < 3) { await sleep(2000 * attempt); continue; }
    if (r.status === 401 || r.status === 403) throw new Error("المفتاح مرفوض — صلّحه من الإعدادات");
    if (r.status === 404) throw new Error("اسم النموذج أو الرابط غلط — صلّحه من الإعدادات");
    if (r.status === 429) throw new Error("وصلت حدّ المزوّد، استنّى دقيقة وجرّب");
    let j = null; try { j = JSON.parse(raw); } catch (e) {}
    if (!r.ok) throw new Error((j && j.error && j.error.message) || ("خطأ " + r.status));
    return (j && j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || "";
  }
}

// ---------- JSON ← صفوف ----------
function num(v) {
  if (typeof v === "number") return v;
  if (v == null || v === "") return "";
  const s = String(v).replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/٫/g, ".").replace(/[^\d.\-]/g, "");
  const n = parseFloat(s);
  return isNaN(n) ? "" : n;
}
const txt = v => v == null ? "" : String(v);
function toRows(name, inv) {
  const items = Array.isArray(inv.items) ? inv.items : [];
  const sub = num(inv.subtotal), tax = num(inv.tax), tot = num(inv.total);
  const notes = [];
  if (sub !== "" && tax !== "" && tot !== "" && Math.abs(sub + tax - tot) > 0.01) notes.push("قبل الضريبة + الضريبة ≠ الإجمالي");
  const sumItems = items.reduce((a, i) => a + (num(i.total) || 0), 0);
  if (items.length && sub !== "" && Math.abs(sumItems - sub) > 0.01) notes.push("مجموع البنود ≠ قبل الضريبة");
  const rate = sub && tax !== "" ? Math.round(tax / sub * 10000) / 100 : "";
  if (rate !== "" && rate !== 0 && Math.abs(rate - 16) > 0.1) notes.push(`نسبة الضريبة ${rate}% مش 16% — تأكّد منها`);
  if (!txt(inv.vendor_tax_no).trim() && tax) notes.push("في ضريبة بس ما في رقم ضريبي للمورّد");
  if (txt(inv.notes).trim()) notes.push(txt(inv.notes).trim());
  return {
    inv: [name, txt(inv.vendor), txt(inv.vendor_tax_no), txt(inv.invoice_no), txt(inv.date), txt(inv.currency), sub, tax, tot, notes.join(" · "), txt(inv.account), rate],
    items: items.map(i => {
      const q = num(i.qty), p = num(i.unit_price), t = num(i.total);
      const bad = q !== "" && p !== "" && t !== "" && Math.abs(q * p - t) > 0.01;
      return [name, txt(inv.invoice_no), txt(i.description), q, p, t, bad ? "الكمية × السعر ≠ القيمة" : ""];
    })
  };
}

// ---------- كتابة كل شي بإكسل دفعة وحدة ----------
function colName(n) { let s = ""; for (; n > 0; n = Math.floor((n - 1) / 26)) s = String.fromCharCode(65 + (n - 1) % 26) + s; return s; }
async function writeToExcel(invRows, itemRows) {
  await Excel.run(async ctx => {
    const sheets = [["الفواتير", INV_HEAD, invRows], ["البنود", ITEM_HEAD, itemRows]]
      .map(([name, head, rows]) => ({ name, head, rows, ws: ctx.workbook.worksheets.getItemOrNullObject(name) }));
    await ctx.sync();
    for (const s of sheets) {
      if (s.ws.isNullObject) s.ws = ctx.workbook.worksheets.add(s.name);
      s.used = s.ws.getUsedRangeOrNullObject(true);
      s.used.load("rowIndex,rowCount");
    }
    await ctx.sync();
    for (const s of sheets) {
      const start = s.used.isNullObject ? 1 : Math.max(1, s.used.rowIndex + s.used.rowCount);   // الصفّ 1 للعناوين
      const last = colName(s.head.length);
      const header = s.ws.getRange(`A1:${last}1`);
      header.values = [s.head];   // كل مرّة: شيت من نسخة أقدم بياخد العناوين الجديدة
      header.format.font.bold = true;
      if (s.rows.length) s.ws.getRange(`A${start + 1}:${last}${start + s.rows.length}`).values = s.rows;
      s.ws.getRange(`A1:${last}${start + s.rows.length}`).format.autofitColumns();
    }
    sheets[0].ws.activate();
    await ctx.sync();
  });
}

function setStatus(t) { $("status").textContent = t; }
async function run() {
  const c = readCfg();
  if (!c.key || !c.url || !c.model) { $("settings").open = true; setStatus("حط المفتاح بالإعدادات واحفظ أوّل."); return; }
  const jobs = queue.slice();
  $("go").disabled = true;
  const t0 = performance.now(), results = new Array(jobs.length);
  let next = 0;
  await Promise.all(Array.from({ length: Math.min(PARALLEL, jobs.length) }, async () => {
    while (next < jobs.length) {
      const i = next++, { file, li } = jobs[i], st = li.querySelector(".st"), t = performance.now();
      li.className = "";
      try {
        st.textContent = "بقرأ الملف…";
        const parts = await toParts(file);
        st.textContent = "بفرّغ…";
        const inv = await extract(parts, c);
        results[i] = toRows(file.name || "صورة ملصوقة", inv);
        st.textContent = `✓ ${txt(inv.vendor) || "؟"} · ${txt(inv.total)} ${txt(inv.currency)} · ${((performance.now() - t) / 1000).toFixed(1)} ث`;
      } catch (e) {
        li.className = "err";
        st.textContent = "✗ " + (e.message || e);
      }
    }
  }));
  const done = results.filter(Boolean);
  const secs = ((performance.now() - t0) / 1000).toFixed(1);
  if (!done.length) { setStatus("ما انفرّغت ولا فاتورة."); $("go").disabled = false; return; }
  if (!inExcel) { setStatus(`انفرّغت ${done.length} بـ ${secs} ث — بس الصفحة مش داخل إكسل، فما انكتبت.`); $("go").disabled = false; return; }
  try {
    await writeToExcel(done.map(r => r.inv), done.flatMap(r => r.items));
    setStatus(`✓ انكتبت ${done.length} فاتورة بـ ${((performance.now() - t0) / 1000).toFixed(1)} ث (شيت «الفواتير» و«البنود»).`);
    // اللي انكتبت بتطلع من القائمة، والفاشلة بتضل لإعادة المحاولة
    for (let i = jobs.length - 1; i >= 0; i--) if (results[i]) { jobs[i].li.remove(); queue.splice(queue.indexOf(jobs[i]), 1); }
  } catch (e) {
    setStatus("ما قدرت أكتب بإكسل: " + (e.message || e));
  }
  addFiles([]);
}
$("go").onclick = run;

const HANDLERS = {
  workbook_overview: () => Excel.run(async ctx => {
    const sheets = ctx.workbook.worksheets; sheets.load("items/name");
    const active = sheets.getActiveWorksheet(); active.load("name");
    const sel = ctx.workbook.getSelectedRange(); sel.load("address");
    const tables = ctx.workbook.tables; tables.load("items/name");
    await ctx.sync();
    const used = sheets.items.map(s => { const u = s.getUsedRangeOrNullObject(true); u.load("address,rowCount,columnCount"); return u; });
    const tRanges = tables.items.map(t => { const r = t.getRange(); r.load("address"); return r; });
    await ctx.sync();
    const heads = used.map(u => { if (u.isNullObject) return null; const h = u.getRow(0); h.load("values"); return h; });
    await ctx.sync();
    return { active_sheet: active.name, selection: sel.address,
      sheets: sheets.items.map((s, i) => used[i].isNullObject ? { name: s.name, empty: true }
        : { name: s.name, used: used[i].address, rows: used[i].rowCount, columns: used[i].columnCount, header: heads[i].values[0].slice(0, 40) }),
      tables: tables.items.map((t, i) => ({ name: t.name, address: tRanges[i].address })) };
  }),

  read_range: ({ sheet, address }) => Excel.run(async ctx => {
    const r = ws(ctx, sheet).getRange(address); r.load("address,rowCount,columnCount"); await ctx.sync();
    if (r.rowCount * r.columnCount > MAX_CELLS) throw new Error(`${r.address} has ${r.rowCount * r.columnCount} cells; read at most ${MAX_CELLS} per call`);
    r.load("values,formulas,numberFormat"); await ctx.sync();
    return { address: r.address, values: r.values, formulas: r.formulas, number_formats: r.numberFormat };
  }),

  write_range: ({ sheet, address, cells, number_format, overwrite }) => {
    if (!Array.isArray(cells) || !cells.length || !cells.every(Array.isArray)) throw new Error("cells must be a non-empty 2D array");
    const cols = Math.max(...cells.map(r => r.length));
    if (!cols) throw new Error("cells rows are empty");
    const data = cells.map(r => Array.from({ length: cols }, (_, j) => r[j] == null ? "" : r[j]));
    return Excel.run(async ctx => {
      const r = ws(ctx, sheet).getRange(address).getCell(0, 0).getResizedRange(data.length - 1, cols - 1);
      r.load("address,formulas"); await ctx.sync();
      if (!overwrite) {
        const filled = r.formulas.flat().filter(v => v !== "").length;
        if (filled) throw new Error(`${r.address} already has ${filled} non-empty cells. Ask the accountant before replacing them, then call again with overwrite: true.`);
      }
      r.formulas = data;
      if (number_format) r.numberFormat = grid2(data.length, cols, number_format);
      r.load("values"); await ctx.sync();
      const errors = [];
      r.values.forEach((row, i) => row.forEach((v, j) => { if (typeof v === "string" && /^#[A-Z/0!?]+/.test(v) && errors.length < 50) errors.push({ row: i, column: j, error: v }); }));
      return { written: r.address, errors, values: data.length * cols <= 600 ? r.values : r.values.slice(0, 30) };
    });
  },

  format_range: (a) => Excel.run(async ctx => {
    const r = ws(ctx, a.sheet).getRange(a.address); r.load("rowCount,columnCount"); await ctx.sync();
    const f = r.format;
    if (a.bold != null) f.font.bold = a.bold;
    if (a.italic != null) f.font.italic = a.italic;
    if (a.font_size) f.font.size = a.font_size;
    if (a.font_color) f.font.color = a.font_color;
    if (a.fill) f.fill.color = a.fill;
    if (a.number_format) r.numberFormat = grid2(r.rowCount, r.columnCount, a.number_format);
    if (a.h_align) f.horizontalAlignment = a.h_align;
    if (a.wrap != null) f.wrapText = a.wrap;
    if (a.borders) {
      const edges = ["EdgeTop", "EdgeBottom", "EdgeLeft", "EdgeRight"];
      if (r.rowCount > 1) edges.push("InsideHorizontal");
      if (r.columnCount > 1) edges.push("InsideVertical");
      edges.forEach(e => { f.borders.getItem(e).style = "Continuous"; });
    }
    if (a.column_width === "auto") f.autofitColumns(); else if (a.column_width) f.columnWidth = Number(a.column_width);
    if (a.merge) r.merge(false);
    await ctx.sync();
    return { formatted: a.address };
  }),

  add_sheet: ({ name, activate }) => Excel.run(async ctx => {
    const s = ctx.workbook.worksheets.add(name);
    if (activate) s.activate();
    await ctx.sync();
    return { added: name };
  }),

  create_table: ({ sheet, address, name, style }) => Excel.run(async ctx => {
    const t = ws(ctx, sheet).tables.add(address, true);
    if (name) t.name = name;
    if (style) t.style = style;
    t.load("name"); await ctx.sync();
    return { table: t.name };
  }),

  add_chart: ({ sheet, source, type, title, anchor }) => Excel.run(async ctx => {
    const s = ws(ctx, sheet);
    const ch = s.charts.add(type, s.getRange(source), "Auto");
    if (title) ch.title.text = title;
    if (anchor) ch.setPosition(anchor);
    ch.load("name"); await ctx.sync();
    return { chart: ch.name };
  }),

  conditional_format: (a) => Excel.run(async ctx => {
    const cfs = ws(ctx, a.sheet).getRange(a.address).conditionalFormats;
    const paint = fmt => { if (a.fill) fmt.fill.color = a.fill; if (a.font_color) fmt.font.color = a.font_color; };
    if (a.rule === "color_scale") {
      cfs.add("ColorScale").colorScale.criteria = {
        minimum: { formula: null, type: "LowestValue", color: "#F8696B" }, maximum: { formula: null, type: "HighestValue", color: "#63BE7B" } };
    } else if (a.rule === "data_bar") {
      cfs.add("DataBar");
    } else if (a.rule === "duplicates") {
      const p = cfs.add("PresetCriteria").preset;
      p.rule = { criterion: "DuplicateValues" };
      if (!a.fill && !a.font_color) a.fill = "#FFC7CE";
      paint(p.format);
    } else if (a.rule === "formula") {
      const c = cfs.add("Custom").custom;
      c.rule.formula = a.formula;
      paint(c.format);
    } else {
      const c = cfs.add("CellValue").cellValue;
      c.rule = { formula1: String(a.value1), ...(a.value2 != null ? { formula2: String(a.value2) } : {}), operator: a.operator || "GreaterThan" };
      paint(c.format);
    }
    await ctx.sync();
    return { added: a.rule, address: a.address };
  }),

  data_validation: ({ sheet, address, type, list, min, max }) => Excel.run(async ctx => {
    const dv = ws(ctx, sheet).getRange(address).dataValidation;
    dv.clear();
    dv.rule = type === "list"
      ? { list: { inCellDropDown: true, source: list } }
      : { [type]: { formula1: min, ...(max != null ? { formula2: max, operator: "Between" } : { operator: "GreaterThanOrEqualTo" }) } };
    await ctx.sync();
    return { validated: address };
  }),

  freeze_panes: ({ sheet, rows = 0, columns = 0 }) => Excel.run(async ctx => {
    const fp = ws(ctx, sheet).freezePanes;
    fp.unfreeze();
    if (rows && columns) fp.freezeAt(ws(ctx, sheet).getRangeByIndexes(0, 0, rows, columns));
    else if (rows) fp.freezeRows(rows);
    else if (columns) fp.freezeColumns(columns);
    await ctx.sync();
    return { frozen: { rows, columns } };
  }),

  sort_range: ({ sheet, address, column_index, ascending = true, has_headers = true }) => Excel.run(async ctx => {
    ws(ctx, sheet).getRange(address).sort.apply([{ key: column_index, ascending }], false, has_headers);
    await ctx.sync();
    return { sorted: address };
  }),

  change_structure: ({ sheet, address, action, confirmed }) => {
    if (!confirmed) throw new Error("Destructive change: ask the accountant first, then call again with confirmed: true.");
    return Excel.run(async ctx => {
      const s = ws(ctx, sheet);
      if (action === "delete_sheet") s.delete();
      else {
        if (!address) throw new Error("address is required for " + action);
        const r = s.getRange(address);
        ({ insert_rows: () => r.getEntireRow().insert("Down"), insert_columns: () => r.getEntireColumn().insert("Right"),
           delete_rows: () => r.getEntireRow().delete("Up"), delete_columns: () => r.getEntireColumn().delete("Left"),
           clear_contents: () => r.clear("Contents") })[action]();
      }
      await ctx.sync();
      return { done: action };
    });
  },

  create_pivot: ({ name, source_sheet, source_address, dest_sheet, dest_cell, rows, columns = [], values }) => Excel.run(async ctx => {
    const src = ctx.workbook.worksheets.getItem(source_sheet).getRange(source_address);
    const pt = ctx.workbook.pivotTables.add(name, src, ws(ctx, dest_sheet).getRange(dest_cell));
    rows.forEach(f => pt.rowHierarchies.add(pt.hierarchies.getItem(f)));
    columns.forEach(f => pt.columnHierarchies.add(pt.hierarchies.getItem(f)));
    values.forEach(v => { const d = pt.dataHierarchies.add(pt.hierarchies.getItem(v.field)); if (v.summarize) d.summarizeBy = v.summarize; });
    await ctx.sync();
    return { pivot: name };
  }),

  define_name: ({ name, sheet, address }) => Excel.run(async ctx => {
    ctx.workbook.names.add(name, ws(ctx, sheet).getRange(address));
    await ctx.sync();
    return { named: name };
  })
};

async function chatSend() {
  const text = $("ask").value.trim();
  if (!text) return;
  const c = readCfg();
  if (c.provider !== "anthropic" || !c.key) { $("settings").open = true; say("err", "مساعد إكسل بيشتغل مع Claude: اختار Anthropic من الإعدادات وحط المفتاح."); return; }
  if (!inExcel) say("err", "الصفحة مش داخل إكسل، فالأدوات ما رح تقدر توصل للملف.");
  $("ask").value = ""; say("me", text);
  $("send").disabled = true; $("stop").hidden = false; stopAsked = false;
  const fb = /^claude-(opus-5|fable-5|sonnet-5-5)/.test(c.model) ? { betas: ["server-side-fallback-2026-07-01"], fallbacks: "default" } : {};
  // إذا الدور اللي قبل وقف (خطأ أو «وقّف») بعد نتائج أدوات ما انبعتت، الكلام الجديد بينضمّ لنفس رسالة المستخدم
  const note = { type: "text", text: text + await selectionNote() };
  const last = CHAT[CHAT.length - 1];
  if (last && last.role === "user") last.content.push(note); else CHAT.push({ role: "user", content: [note] });
  let Anthropic = null;
  try {
    ({ default: Anthropic } = await import(ANTHROPIC_SDK));
    const client = new Anthropic({ apiKey: c.key, baseURL: c.url || undefined, dangerouslyAllowBrowser: true });
    for (let step = 1; ; step++) {
      if (stopAsked) { say("step", "وقّفت بطلبك."); break; }
      if (step > MAX_STEPS) { say("err", `وصلت ${MAX_STEPS} خطوة ولسّا ما خلّصت — قلّي «كمّل» إذا بدّك أكمّل.`); break; }
      $("cstatus").textContent = "بفكّر…";
      const msg = await client.beta.messages.create({
        model: c.model, max_tokens: 16000, ...fb,
        output_config: { effort: "medium" },
        cache_control: { type: "ephemeral" },
        system: EXCEL_SYSTEM, tools: TOOLS, messages: CHAT
      });
      CHAT.push({ role: "assistant", content: msg.content });
      for (const b of msg.content) if (b.type === "text" && b.text.trim()) say("ai", b.text.trim());
      if (msg.stop_reason === "refusal") { say("err", "Claude رفض هالطلب."); break; }
      if (msg.stop_reason === "pause_turn") continue;
      if (msg.stop_reason !== "tool_use") break;
      const results = [];
      for (const b of msg.content.filter(b => b.type === "tool_use")) {
        const label = STEP_LABEL[b.name] ? STEP_LABEL[b.name](b.input || {}) : b.name;
        const line = say("step", "• " + label + "…");
        try {
          if (!HANDLERS[b.name]) throw new Error("unknown tool " + b.name);
          const out = await HANDLERS[b.name](b.input || {});
          results.push({ type: "tool_result", tool_use_id: b.id, content: JSON.stringify(out) });
          line.textContent = "✓ " + label + (out.errors && out.errors.length ? ` (${out.errors.length} خطأ بالمعادلات، بصلّحهم)` : "");
        } catch (e) {
          results.push({ type: "tool_result", tool_use_id: b.id, content: String((e && (e.debugInfo && e.debugInfo.message || e.message)) || e), is_error: true });
          line.textContent = "✗ " + label;
        }
      }
      CHAT.push({ role: "user", content: results });
    }
  } catch (e) {
    let m = e && e.message || String(e);
    if (!Anthropic) m = "ما قدرت أحمّل مكتبة Claude — تأكّد من النت";
    else if (e instanceof Anthropic.AuthenticationError || e instanceof Anthropic.PermissionDeniedError) m = "المفتاح مرفوض — صلّحه من الإعدادات";
    else if (e instanceof Anthropic.NotFoundError) m = "اسم النموذج غلط — صلّحه من الإعدادات";
    else if (e instanceof Anthropic.RateLimitError) m = "وصلت حدّ Anthropic، استنّى دقيقة وجرّب";
    say("err", m);
  }
  $("cstatus").textContent = ""; $("send").disabled = false; $("stop").hidden = true;
}
$("send").onclick = chatSend;
$("ask").onkeydown = e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) chatSend(); };
$("stop").onclick = () => { stopAsked = true; $("cstatus").textContent = "بوقّف بعد هالخطوة…"; };
$("newchat").onclick = () => { CHAT = []; $("chat").innerHTML = ""; $("cstatus").textContent = ""; };

function showTab(chat) {
  $("tab-chat").hidden = !chat; $("tab-inv").hidden = chat;
  $("t-chat").setAttribute("aria-selected", chat); $("t-inv").setAttribute("aria-selected", !chat);
  if (chat) $("ask").focus();
}
$("t-inv").onclick = () => showTab(false);
$("t-chat").onclick = () => showTab(true);

fillCfg();
Office.onReady(info => { inExcel = info.host === Office.HostType.Excel; });
</script>
</body>
</html>
